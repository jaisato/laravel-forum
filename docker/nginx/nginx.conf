# Nginx of the forum (web image; compose.yaml mounts it over the stock
# image): serves public/ and hands everything else to PHP-FPM on app:9000.
# It runs as the unprivileged nginx user, hence port 8080 and /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/nginx-client-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    proxy_temp_path /tmp/nginx-proxy;
    scgi_temp_path /tmp/nginx-scgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;

    # Behind Caddy, $remote_addr is the proxy and the client comes in
    # X-Forwarded-For, which Laravel trusts from TRUSTED_PROXIES alone.
    log_format forum '$remote_addr "$http_x_forwarded_for" [$time_local] '
                     '"$request" $status $body_bytes_sent $request_time '
                     '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout forum;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # docker/php/conf.d/forum.ini: post_max_size = 10M
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/javascript application/json
               application/manifest+json application/xml image/svg+xml
               text/css text/plain text/xml;

    # Docker's DNS: app is looked up again when its container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        # Caddy adds HSTS in production (docker/caddy/Caddyfile).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

        location = /favicon.ico {
            access_log off;
            log_not_found off;
        }

        # Vite's files carry a hash in their names: browsers keep them a year
        # and never ask again (spec §10). An add_header here drops the
        # server's own, so the security headers are repeated.
        location /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
            access_log off;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            set $php_fpm app:9000;
            fastcgi_pass $php_fpm;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            # httpoxy: a client's Proxy header never reaches PHP as HTTP_PROXY
            fastcgi_param HTTP_PROXY "";
            fastcgi_buffer_size 32k;
            fastcgi_buffers 16 16k;
            fastcgi_read_timeout 120s;
        }

        # No other PHP file is ever run or shown.
        location ~ \.php$ {
            return 404;
        }

        # Dotfiles (.htaccess…), /.well-known aside.
        location ~ /\.(?!well-known/) {
            deny all;
        }
    }
}
