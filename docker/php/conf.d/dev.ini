; Development (dev image, code mounted from the host): OPcache picks up every
; change at once, pcov measures coverage and Xdebug stays off until
; XDEBUG_MODE asks for it (debug, develop, coverage, profile…).

opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

xdebug.mode = off
xdebug.client_host = host.docker.internal
xdebug.start_with_request = trigger
