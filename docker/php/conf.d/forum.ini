; PHP settings shared by the dev and app images (docs/04-despliegue.md).

expose_php = Off

memory_limit = 256M
max_execution_time = 30

; An avatar may weigh 2 MB (forum.profiles.avatar.max_kilobytes) and the forum
; validates that limit itself: PHP takes a little more so the member gets the
; forum's message instead of a failed upload. Nginx: client_max_body_size.
upload_max_filesize = 8M
post_max_size = 10M

; Laravel opens many files on each request
realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
