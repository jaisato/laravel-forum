; PHP-FPM pool of the forum images, loaded after the image's zz-docker.conf
; (listen = 9000, logs to stderr). The pool sizes come from the environment:
; defaults in the Dockerfile.

[www]
pm = dynamic
pm.max_children = ${PHP_FPM_PM_MAX_CHILDREN}
pm.start_servers = ${PHP_FPM_PM_START_SERVERS}
pm.min_spare_servers = ${PHP_FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${PHP_FPM_PM_MAX_SPARE_SERVERS}
pm.max_requests = ${PHP_FPM_PM_MAX_REQUESTS}

; Answered over FastCGI alone: Nginx passes nothing but /index.php
; (php-fpm-healthcheck asks /ping)
ping.path = /ping
ping.response = pong
pm.status_path = /status

; Nginx logs the requests already
access.log = /dev/null

; Ends a request stuck past Nginx's fastcgi_read_timeout
request_terminate_timeout = 120s
