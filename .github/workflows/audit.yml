name: Dependency audit

# Known advisories against what the lockfiles pin. Runs with every push and pull
# request like the rest of CI, and once a week on its own: an advisory published
# against a version the lock already carries arrives without a commit, and only a
# scheduled run turns red for it. That is exactly how league/commonmark 2.9.1 sat
# here after the DoS advisory landed against it.
#
# GitHub switches scheduled workflows off in a repository with no commit for 60
# days and emails the owner; the Actions tab turns it back on.
on:
  # Every push, on every branch: a lockfile change on a topic branch is audited
  # before anyone opens a pull request for it. The job is one `audit` call and
  # takes seconds, so running it twice on a branch with a pull request open
  # costs nothing worth protecting (unlike ci.yml).
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer:
    name: composer audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # --locked reads composer.lock and installs nothing. An abandoned package
      # is reported, not failed on: it is a maintenance signal, not an advisory.
      - name: Audit the locked dependencies
        run: composer audit --locked --abandoned=report

  npm:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # The front end is half this application: every severity fails, as on the
      # composer side (no --audit-level, no --omit=dev). `npm audit` runs
      # through .github/scripts/npm-audit-allowlist.mjs, which only tolerates
      # what .github/npm-audit-allowlist.json lists: one advisory (GHSA) of one
      # package each, with its reason and date. The list is empty: every
      # advisory fails the job. Adding an exception is editing that JSON, not
      # this workflow; the script warns when an exception no longer matches any
      # advisory and fails when a tolerated one gets a non-breaking fix. It
      # installs nothing: npm audit reads package-lock.json.
      - name: Audit the locked dependencies
        run: node .github/scripts/npm-audit-allowlist.mjs
