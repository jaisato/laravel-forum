name: Dependency audit

# Known advisories against what the lockfiles pin. Runs with every push and pull
# request like the rest of CI, and once a week on its own: an advisory published
# against a version the lock already carries arrives without a commit, and only a
# scheduled run turns red for it. That is exactly how league/commonmark 2.9.1 sat
# here after the DoS advisory landed against it.
#
# GitHub switches scheduled workflows off in a repository with no commit for 60
# days and emails the owner; the Actions tab turns it back on.
on:
  # Every push, on every branch, not just the protected ones. The comment above
  # said "every push" while the trigger filtered to main and master, so a
  # lockfile change on a topic branch went unaudited until somebody opened a
  # pull request for it. This job is one `audit` invocation and takes seconds,
  # so running it twice on a branch that also has a PR open costs nothing worth
  # protecting - unlike ci.yml, which is filtered for exactly that reason.
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer:
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # --locked reads composer.lock and installs nothing. An abandoned package
      # is reported, not failed on: it is a maintenance signal, not an advisory.
      - name: Audit the locked dependencies
        run: composer audit --locked --abandoned=report

  npm:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The front end is half this application; an advisory against the Vue or
      # Vite tree matters as much as one against the PHP tree.
      #
      # No --audit-level. It was `high`, which npm documents as the minimum
      # severity that exits non-zero - so a moderate advisory printed a warning
      # and the job stayed green. That threshold would have slept through the
      # very thing this branch fixes: the qs advisory in e710d86 is moderate.
      # The composer job above has no threshold either, and there is no reason
      # for the two halves of the application to be held to different bars.
      #
      # Ya no es `npm audit` a secas, sino `npm audit --json` filtrado por una
      # lista de excepciones (.github/npm-audit-allowlist.json, leída por
      # .github/scripts/npm-audit-allowlist.mjs). El motivo es GHSA-vfj7-8cjw-p6xm,
      # contra `braces <= 3.0.3`: no existe versión parcheada -3.0.3 es la última
      # publicada- y entra únicamente por tailwindcss 3, así que la única salida
      # que npm ofrece es `npm audit fix --force`, es decir, Tailwind 4. Eso es
      # un cambio de versión mayor, no una actualización de seguridad, y aquí
      # `braces` solo expande los globs de `content` de tailwind.config.js en
      # el build: no le llega entrada de nadie. Decisión tomada: riesgo asumido
      # y documentado, sin migrar por esto.
      #
      # Lo que NO se ha hecho es bajar el listón. No hay `continue-on-error`,
      # ni `--audit-level`, ni `--omit=dev` (que silenciaría también axios, que
      # es devDependency pero acaba en el navegador). La lista tolera un aviso
      # concreto (GHSA) de un paquete concreto, con motivo y fecha, y el script
      # falla con todo lo demás: otro paquete, otro GHSA del mismo `braces`, o
      # ese mismo aviso el día que npm ofrezca un parche que no exija un mayor,
      # momento en el que la entrada sobra y hay que actualizar. Las entradas
      # transitivas (chokidar, micromatch, fast-glob, tailwindcss, typography)
      # solo se toleran mientras su único origen sea un aviso tolerado.
      #
      # Añadir una excepción es editar el JSON, no este workflow ni el script;
      # quitarla vuelve a exigir el aviso. El script no instala nada: igual
      # que antes, `npm audit` trabaja sobre package-lock.json.
      - name: Audit the locked dependencies
        run: node .github/scripts/npm-audit-allowlist.mjs
