name: CI

# There was no CI here, and it showed: phpunit.xml declared a `tests/Unit`
# directory that the repository does not contain, so PHPUnit aborted with exit
# code 2 before running a single one of the Feature tests. Nothing was watching,
# so a suite that ran nothing at all looked exactly like a suite that passed.

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  test:
    name: Tests (Pest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist'

      # No `cp .env.example .env` step: the suite reads the tracked .env.testing,
      # which phpunit.xml selects by setting APP_ENV=testing. The one value that
      # file does not carry is APP_KEY - it shipped with a real generated key at
      # first and GitGuardian flagged it, correctly: a valid Laravel key in the
      # repository cannot be told apart from a production one by anything reading
      # the file. `composer test` runs this same step for anyone working locally,
      # so a clean clone still needs no setup.
      #
      # --fail-on-warning is the point of the job as much as the assertions are.
      # A missing environment file surfaced as a PHP warning attached to every
      # test while they all still reported green, so warnings are the shape this
      # repository's breakage has actually taken.
      - name: Generate the test application key
        run: php artisan key:generate --env=testing

      - name: Run the test suite
        run: vendor/bin/pest --fail-on-warning

  assets:
    name: Front-end build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # resources/js/app.js imports Ziggy as '../../vendor/tightenco/ziggy'.
      # That is a Composer package that happens to ship JavaScript, so the
      # bundle cannot be built from npm alone: without vendor/ on disk Vite
      # fails to resolve the import and the build dies after transforming 27
      # modules. PHP is set up here only to run composer.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies (Ziggy is one of them)
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist'

      - name: Install dependencies
        run: npm ci

      # The Vue pages are only ever exercised through Vite; nothing else in CI
      # would notice a template that stopped compiling.
      - name: Build
        run: npm run build
