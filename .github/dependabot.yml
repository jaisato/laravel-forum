# Weekly, grouped dependency updates (spec §13): one pull request per
# ecosystem with its minor and patch updates, and one per major version, so
# a breaking change never hides among the routine ones. CI judges each of
# them like any other pull request; security updates come apart, as soon as
# GitHub knows about them. The data stores are left out: PostgreSQL and
# Meilisearch cannot open the data of another version as they find it, and
# CI's empty volumes would never notice (docs/04-despliegue.md, section 11).

version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      composer:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      npm:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the runtime (Node 24 in the Dockerfile and CI), not
      # the newest Node: its majors are bumped by hand together with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x declares `peer typescript@">=4.8.4 <6.1.0"`, so
      # TypeScript 7 cannot even install (#34). Drop this entry once
      # typescript-eslint supports it.
      - dependency-name: typescript
        versions: [">=7.0.0, <8.0.0"]
      # vue-tsc 3.3.14 generates invalid code for a template attribute value
      # that contains `//` (placeholder="https://" in the profile settings
      # page) and fails with TS2339 (vuejs/language-tools#6322). package.json
      # pins 3.3.13; drop this entry and the pin with the release that fixes it.
      - dependency-name: vue-tsc
        versions: ["3.3.14"]
    commit-message:
      prefix: build(deps)

  # The actions are pinned to commits: Dependabot moves the SHA and the
  # version in the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)

  # The Dockerfile's base images.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      docker:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # The Node base image follows the runtime the project targets (Node 24,
      # the current LTS; CI and @types/node are pinned to it). A new Node major
      # is adopted by hand, in one change with CI and @types/node, once it is LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # PHP 8.6 cannot build the images yet (#63): the latest phpredis (6.3.0)
      # and pcov (1.0.12) do not compile on it and Xdebug 3.5.3 refuses it;
      # their 8.6 support is only in phpredis 6.4.0RC1, Xdebug 3.6.0alpha1 and
      # pcov's develop branch. Drop this entry once the three have stable
      # releases, and adopt 8.6 by hand: its images lose pecl (PIE instead,
      # docker-library/php#1654) and mbstring, and their FPM is always ZTS.
      - dependency-name: php
        versions: [">= 8.6, < 8.7"]
    commit-message:
      prefix: build(docker)

  # The services' images in compose.yaml and compose.prod.yaml (PostgreSQL,
  # Redis, Meilisearch, Caddy…).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    groups:
      docker-compose:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: getmeili/meilisearch
      - dependency-name: pgvector/pgvector
    commit-message:
      prefix: build(docker)
